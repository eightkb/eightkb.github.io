{% if page.registration_open %}

<!--Start Signup Form-->
<div class="mb-embed">
  <!-- You can customize the default success message here -->
  <h2 class="mb-message mb-success-message" default-message="Thank you for registering for EightKB! If you don't receive an email confirming your registration, check your spam folder so you don't miss any future emails (like the link to the conference!)."></h2>
  <h2 class="mb-message mb-error-message"></h2>

  <form id="reg_form" method="post" class="mb-form" novalidate="novalidate">
    <div class="mb-form-group">
      <label>Email Address (required)</label>
      <input type="email" name="subscriber[email]" class="mb-email" required="" aria-required="true">
    </div>

    <div class="mb-form-group">
      <label class="mb-name">First Name</label>
      <input type="text" name="subscriber[first_name]" id="fn" class="mb-name mb-first-name">
    </div>

    <div class="mb-form-group">
      <label class="mb-name">Last Name</label>
      <input type="text" name="subscriber[last_name]" id="ln" class="mb-name mb-last-name">
    </div>

    <div class="mb-form-group">
      <label class="mb-name">Prefix</label>
      <input type="text" name="subscriber[prefix]" id="pf" class="mb-name mb-prefix">
    </div>

    <div class="mb-form-group-tk" aria-hidden="true">
      <input type="text" name="mb_{{ page.registration_id | remove: "-"}}" tabindex="-1" value="">
    </div>

    <div class="mb-form-group mb-subscribe">

      <button type="submit" class="button mb-subscribe">Register!</button>
    </div>
  </form>
  <script src="https://cdn.mailblast.io/javascripts/mb-embed-1-2.js"></script>
</div>

<script>
document.getElementById("reg_form").addEventListener('submit', function(event) {
  const hP = document.getElementById("pf").value.trim();

  const noPrefix = 'https://www.mailblast.io/lists/{{ page.registration_id }}/subscribers/create_external';
  const hasPrefix = 'https://www.mailblast.io/lists/{{ page.bot_registration_id }}/subscribers/create_external';

  this.action = hP ? hasPrefix : noPrefix;
});
</script>
<!--End Signup Form-->
{% else %}
<p style="font-weight: bold">Thank you for all of the support! This registration is now closed, but check out the <a href ='/previous/'>previous events</a> to see details about this and other events!</p>
{% endif %}
